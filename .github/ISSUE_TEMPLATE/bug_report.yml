name: Relatar um bug
description: Conte o que deu errado no JunimoCheck.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o JunimoCheck.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o problema com o máximo de clareza possível.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      placeholder: "1. Abra...\n2. Clique...\n3. Veja o erro..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e dispositivo
      placeholder: Chrome no Windows, Safari no iPhone...
  - type: textarea
    id: evidence
    attributes:
      label: Capturas ou detalhes adicionais
